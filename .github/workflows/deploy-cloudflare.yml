# 推送到 master 后自动构建并发布到 Cloudflare Pages（项目 cloud-tycoon-page）。
# 需要在仓库 Settings → Secrets and variables → Actions 里添加：
#   CLOUDFLARE_API_TOKEN   权限只要「帐户 → Cloudflare Pages → 编辑」
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 帐户 ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::还没有配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，见 README「自动部署」"
            exit 1
          fi
          npx wrangler pages deploy --branch master
